	<!-- the login form for new users  -->
	<div class="container mt-5">
		<div class="row justify-content-center">
		  <div class="col-12 col-sm-10 col-md-6 col-lg-4">
			<div class="card">
			  <div class="card-body">
				<form hx-post="/signup" hx-swap="outerHTML" method="POST">
					<div class="form-group">
						<label for="first_name">First Name</label>
						<input
						  type="text"
						  class="form-control is-invalid"
						  id="firstName"
						  name="first_name"
						  placeholder="Enter last name"
						>
						<div class="invalid-feedback">
						  First name is required.
						</div>
					</div>
					<div class="form-group">
						<label for="last_name">Last Name</label>
						<input
						  type="text"
						  class="form-control is-invalid"
						  id="lastName"
						  name="last_name"
						  placeholder="Enter last name"
						>
						<div class="invalid-feedback">
						  Last name is required.
						</div>
					</div>
					<div class="form-group">
					<label for="email">Email address</label>
					<input type="email" class="form-control is-invalid" id="email" name="email" aria-describedby="emailHelp" placeholder="Enter email">
					<div class="invalid-feedback">
						Email is required.
					</div>
					<small id="emailHelp" class="form-text text-muted">We'll never share your email with anyone else.</small>
					</div>
					<div class="form-group">
						<label for="userName">User name</label>
						<input
						  type="text"
						  class="form-control is-invalid"
						  id="userName"
						  name="username"
						  placeholder="Create a username"
						>
						<div class="invalid-feedback">
						  Username is required.
						</div>
					</div>
					<div class="form-group">
					  <label for="exampleInputPassword1">Password</label>
					  <input type="password" class="form-control is-invalid" id="password" name="password" placeholder="Create a password">
					  <div class="invalid-feedback">
						Password is required.
					  </div>
					</div>
					<div class="form-check">
					  <input type="checkbox" class="form-check-input" id="exampleCheck1">
					  <label class="form-check-label" for="exampleCheck1">Check me out</label>
					</div>
					<button type="submit" class="btn btn-primary" value="Submit">Create Account</button>
				</form>
			  </div>
			</div>
		  </div>
		</div>
	  </div>
